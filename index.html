<li><b>反語形Ⅱ：</b>51〜54（何以・何為・幾何・如何）が丸ごと抜け。57は「独り〜か」で「だけが」は不要</li>
<li><b>荀→苟：</b>「荀（じ）」は誤字。正しくは <b>苟（いやしくも）</b>。「耳（のみ）」と混ざっていた</li>
<li><b>雖（いへども）</b>が抜け。「不唯〜」累加形も追加</li>
<li><b>乎・哉・安・悪・寧：</b>読みが不足（置き字の用法、やすんず、にくむ、あし等）。<b>奚</b>も追加</li>
<li><b>受身・使役：</b><b>所</b>が抜け。使＝仮定「もし〜ば」、見＝まみユ、為の読み6種を補足</li></ul>
